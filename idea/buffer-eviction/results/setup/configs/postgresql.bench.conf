# Settings shared by every benchmark run (policy and shared_buffers are
# passed on the command line by run_one.sh).
listen_addresses = 'localhost'
port = 5440
max_connections = 100
# make every shared_buffers miss a real device read (no OS page cache)
debug_io_direct = 'data'
# keep commit flushes on the QLC SSD from dominating OLTP throughput
synchronous_commit = off
wal_level = minimal
max_wal_senders = 0
checkpoint_timeout = 30min
max_wal_size = 8GB
min_wal_size = 1GB
# isolate the replacement policy: no bgwriter cleaning, no autovacuum noise
bgwriter_lru_maxpages = 0
autovacuum = off
max_parallel_workers_per_gather = 0
jit = off
track_io_timing = on
log_line_prefix = '%m [%p] '
